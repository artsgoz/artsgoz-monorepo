name: CI

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging

permissions:
  contents: read

jobs:
  validate-branch-flow:
    name: Validate Branch Flow
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    steps:
      - name: Enforce staging → develop flow
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Direct PRs to 'develop' are not allowed."
            echo "Required flow: branch/* → staging → develop"
            echo "Please open your PR against 'staging' first."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-production:
    name: Deploy Production
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice && pnpm build:kb
      - name: Deploy frontend
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy Knowledge Base
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:kb --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-staging:
    name: Deploy Staging
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice && pnpm build:kb
      - name: Deploy frontend-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend-staging --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice-staging --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy kb-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:kb-staging --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-kb-api-production:
    name: Deploy KB API Production
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-kb-api-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_KB_API_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build KB API
        run: pnpm nx build @org/kb-api
      - name: Prepare pnpm for Vercel
        id: prepare_pnpm_vercel_production
        run: |
          npm install -g pnpm@10.28.0
          PNPM_BIN="$(dirname "$(which pnpm)")"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "pnpm_bin=$PNPM_BIN" >> "$GITHUB_OUTPUT"
          which pnpm
          pnpm --version
      - name: Deploy KB API to Vercel production
        env:
          PNPM_BIN: ${{ steps.prepare_pnpm_vercel_production.outputs.pnpm_bin }}
        run: |
          export PATH="$PNPM_BIN:$PATH"
          which pnpm
          pnpm --version
          pnpm dlx vercel@latest deploy --yes --prod

  deploy-kb-api-staging:
    name: Deploy KB API Staging
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-kb-api-staging
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_KB_API_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build KB API
        run: pnpm nx build @org/kb-api
      - name: Prepare pnpm for Vercel
        id: prepare_pnpm_vercel_staging
        run: |
          npm install -g pnpm@10.28.0
          PNPM_BIN="$(dirname "$(which pnpm)")"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "pnpm_bin=$PNPM_BIN" >> "$GITHUB_OUTPUT"
          which pnpm
          pnpm --version
      - name: Deploy KB API to Vercel preview
        env:
          PNPM_BIN: ${{ steps.prepare_pnpm_vercel_staging.outputs.pnpm_bin }}
        run: |
          export PATH="$PNPM_BIN:$PATH"
          which pnpm
          pnpm --version
          pnpm dlx vercel@latest deploy --yes

  deploy-preview:
    name: Deploy PR Preview
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect preview changes
        id: preview_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed_files"

          affects_all='^(package.json|pnpm-lock.yaml|nx.json|tsconfig\.base\.json|firebase\.json|packages/design-system/)'
          affects_frontend='^(apps/frontend/)'
          affects_backoffice='^(apps/backoffice/)'
          affects_kb='^(apps/kb/)'

          if echo "$changed_files" | grep -Eq "$affects_all|$affects_frontend"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq "$affects_all|$affects_backoffice"; then
            echo "backoffice=true" >> "$GITHUB_OUTPUT"
          else
            echo "backoffice=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq "$affects_all|$affects_kb"; then
            echo "kb=true" >> "$GITHUB_OUTPUT"
          else
            echo "kb=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build frontend preview
        if: steps.preview_changes.outputs.frontend == 'true'
        run: pnpm build:frontend
      - name: Build backoffice preview
        if: steps.preview_changes.outputs.backoffice == 'true'
        run: pnpm build:backoffice
      - name: Build kb preview
        if: steps.preview_changes.outputs.kb == 'true'
        run: pnpm build:kb
      - name: Deploy frontend preview
        if: steps.preview_changes.outputs.frontend == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANNEL="pr${PR_NUMBER}"
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase_deploy() {
            npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
              --only frontend --expires 7d \
              --project chula-artsgoz-website 2>&1
          }
          output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "already exists"; then
            echo "Channel race condition — retrying..."
            sleep 3
            output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          fi
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — preview already deployed."
            exit 0
          fi
          echo "$output"
          exit $exit_code

      - name: Deploy backoffice preview
        if: steps.preview_changes.outputs.backoffice == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANNEL="pr${PR_NUMBER}"
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase_deploy() {
            npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
              --only backoffice --expires 7d \
              --project chula-artsgoz-website 2>&1
          }
          output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "already exists"; then
            echo "Channel race condition — retrying..."
            sleep 3
            output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          fi
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — preview already deployed."
            exit 0
          fi
          echo "$output"
          exit $exit_code

      - name: Deploy kb preview
        if: steps.preview_changes.outputs.kb == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANNEL="pr${PR_NUMBER}"
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase_deploy() {
            npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
              --only kb --expires 7d \
              --project chula-artsgoz-website 2>&1
          }
          output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "already exists"; then
            echo "Channel race condition — retrying..."
            sleep 3
            output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          fi
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — preview already deployed."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-kb-api-preview:
    name: Deploy KB API PR Preview
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-kb-api-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_KB_API_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build KB API
        run: pnpm nx build @org/kb-api
      - name: Prepare pnpm for Vercel
        id: prepare_pnpm_vercel_preview
        run: |
          npm install -g pnpm@10.28.0
          PNPM_BIN="$(dirname "$(which pnpm)")"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "pnpm_bin=$PNPM_BIN" >> "$GITHUB_OUTPUT"
          which pnpm
          pnpm --version
      - name: Deploy KB API to Vercel preview
        env:
          PNPM_BIN: ${{ steps.prepare_pnpm_vercel_preview.outputs.pnpm_bin }}
        run: |
          export PATH="$PNPM_BIN:$PATH"
          which pnpm
          pnpm --version
          pnpm dlx vercel@latest deploy --yes
