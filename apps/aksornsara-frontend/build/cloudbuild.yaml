steps:
  # Install monorepo dependencies
  - name: 'node:22'
    entrypoint: 'bash'
    args: ['-c', 'corepack pnpm install --frozen-lockfile']
    dir: '.'

  # Build Aksornsara frontend
  - name: 'node:22'
    entrypoint: 'bash'
    env:
      - 'VITE_API_BASE_URL=${_API_BASE_URL}'
      - 'VITE_MAINTENANCE_MODE=${_MAINTENANCE_MODE}'
      - 'VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - 'VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - 'VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
    args:
      - '-c'
      - |
        corepack pnpm exec nx build @artsgoz/aksornsara-frontend

  # Deploy Aksornsara frontend
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy \
          --only hosting:aksornsara-frontend \
          --project "$PROJECT_ID"

substitutions:
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_APP_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
