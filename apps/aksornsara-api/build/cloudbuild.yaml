steps:
  # App Hosting builds the API remotely from the uploaded source.
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy \
          --only apphosting:aksornsara-api \
          --project "$PROJECT_ID"

options:
  logging: CLOUD_LOGGING_ONLY
