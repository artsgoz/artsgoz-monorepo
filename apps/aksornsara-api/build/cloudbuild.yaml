steps:
  # Install monorepo dependencies
  - name: 'node:22'
    entrypoint: 'bash'
    args: ['-c', 'corepack pnpm install --frozen-lockfile']
    dir: '.'

  # Build Aksornsara API!
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack pnpm exec nx build @artsgoz/aksornsara-api

  # Deploy Aksornsara API
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase --debug deploy \
          --only apphosting:aksornsara-api \
          --project "$PROJECT_ID"

options:
  logging: CLOUD_LOGGING_ONLY
