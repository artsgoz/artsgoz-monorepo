steps:
  # Install monorepo dependencies
  - name: 'node:24'
    entrypoint: 'bash'
    args: ['-c', 'corepack pnpm install --frozen-lockfile']
    dir: '.'

  # Build Artsgoz frontend
  - name: 'node:24'
    entrypoint: 'bash'
    env:
      - 'VITE_API_BASE_URL=${_API_BASE_URL}'
      - 'VITE_MAINTENANCE_MODE=${_MAINTENANCE_MODE}'
    args:
      - '-c'
      - |
        test -n "$$VITE_API_BASE_URL" || { echo "Set _API_BASE_URL in the build environment"; exit 1; }
        corepack pnpm exec nx build @artsgoz/artsgoz-frontend

  # Deploy Artsgoz frontend
  - name: 'node:24'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy \
          --only hosting:artsgoz-frontend \
          --project "$PROJECT_ID"

substitutions:
  _API_BASE_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
